name: Build and Save Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: نصب وابستگی‌ها
        run: npm install # تغییر از npm ci به npm install

      - name: ساخت پروژه (Build)
        run: npm run build

      - name: آپلود خروجی به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-bot-build
          path: |
            build/
            app.js
            brain/
            package.json
            node_modules/